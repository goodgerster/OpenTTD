name: CI (Nix)

# Builds and tests inside the Nix dev shell from flake.nix (clang 22, lld, the
# pinned Rust), the same environment as local and cloud development.

on:
  workflow_call:
    inputs:
      runs-on:
        required: true
        type: string
      cmake-parameters:
        required: false
        type: string
        default: ""

env:
  CTEST_OUTPUT_ON_FAILURE: 1

jobs:
  ci:
    name: CI
    runs-on: ${{ inputs.runs-on }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        extra_nix_config: experimental-features = nix-command flakes

    - name: Install OpenGFX
      run: |
        if [ "$(uname -s)" = Darwin ]; then
          dir=~/Documents/OpenTTD/baseset
        else
          dir=~/.local/share/openttd/baseset
        fi
        mkdir -p "$dir"
        cd "$dir"
        curl -sSfL https://cdn.openttd.org/opengfx-releases/0.6.0/opengfx-0.6.0-all.zip -o opengfx-all.zip
        unzip -q opengfx-all.zip
        rm -f opengfx-all.zip

    - name: Install problem matcher
      uses: ammaraskar/gcc-problem-matcher@master

    - name: Configure
      run: nix develop --command cmake -S . -B build -G Ninja -DCMAKE_EXE_LINKER_FLAGS=-fuse-ld=lld ${{ inputs.cmake-parameters }}

    - name: Build
      run: nix develop --command cmake --build build --target all openttd_test

    - name: Test
      run: |
        nix develop --command ctest --test-dir build -j "$(getconf _NPROCESSORS_ONLN)" --timeout 120

        # Check no tracked files have been modified.
        git diff --exit-code
