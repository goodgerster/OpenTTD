name: CI - Build

on:
  pull_request:
#  push:
#    branches:
#    - master
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to build (for Pull Requests, use refs/pull/NNN/head)'
        required: true

env:
  CTEST_OUTPUT_ON_FAILURE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

# Builds run in the Nix dev shell (ci-nix.yml). Windows, MinGW and Emscripten
# are not supported targets of the Rust/C++ build; ci-linux.yml, ci-macos.yml,
# ci-windows.yml, ci-mingw.yml and ci-emscripten.yml are upstream's and unused.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: Linux
          runs-on: ubuntu-latest
        - name: Linux - Dedicated, RANDOM_DEBUG
          runs-on: ubuntu-latest
          cmake-parameters: -DOPTION_DEDICATED=ON -DCMAKE_CXX_FLAGS_INIT="-DRANDOM_DEBUG"
        - name: macOS - Debug
          runs-on: macos-latest
          cmake-parameters: -DCMAKE_BUILD_TYPE=Debug
        - name: macOS - Release
          runs-on: macos-latest
          cmake-parameters: -DCMAKE_BUILD_TYPE=RelWithDebInfo -DOPTION_USE_ASSERTS=OFF

    name: ${{ matrix.name }}

    uses: ./.github/workflows/ci-nix.yml
    secrets: inherit

    with:
      runs-on: ${{ matrix.runs-on }}
      cmake-parameters: ${{ matrix.cmake-parameters }}

  check_annotations:
    name: Check Annotations
    needs:
    - build

    if: always() && github.event_name == 'pull_request'

    runs-on: ubuntu-latest

    steps:
    - name: Check annotations
      uses: OpenTTD/actions/annotation-check@v6
